# Publishes the home-screen web test (web/dist/site) to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Pages only deploys from branches the "github-pages" environment allows
# (the default branch unless you add others in Settings → Environments).
name: Web test on Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'web/test/*.test.js'
      - run: node web/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
